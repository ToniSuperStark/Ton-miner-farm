<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Miner Farm</title>
    <style>
        body { font-family: system-ui; background: #0f172a; color: white; padding: 16px; }
        .card { background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        .balance { font-size: 48px; font-weight: bold; color: #fbbf24; }
        button { background: #3b82f6; border: none; padding: 14px; border-radius: 40px; color: white; font-size: 16px; width: 100%; margin-top: 10px; }
        .miner { background: #334155; border-radius: 16px; padding: 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .buy-btn { background: #22c55e; width: auto; padding: 8px 16px; margin: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div>💰 Баланс</div>
        <div class="balance" id="balance">0</div>
    </div>
    <div class="card">
        <div>⚡ Доступно к сбору</div>
        <div class="balance" id="available">0</div>
        <button id="claimBtn">🚀 Забрать монеты</button>
    </div>
    <div class="card">
        <div>🛠 Мои майнеры</div>
        <div id="minersList">Загрузка...</div>
    </div>

    <script>
        let userId = Telegram.WebApp.initDataUnsafe.user?.id || 'guest';
        let storageKey = 'ton_farm_' + userId;
        
        let gameData = {
            balance: 1000,
            lastClaim: Date.now(),
            basicQty: 1,
            basicLevel: 1,
            proQty: 0,
            proLevel: 1
        };
        
        function saveGame() {
            localStorage.setItem(storageKey, JSON.stringify(gameData));
        }
        
        function loadGame() {
            let saved = localStorage.getItem(storageKey);
            if (saved) {
                gameData = JSON.parse(saved);
                if (!gameData.lastClaim) gameData.lastClaim = Date.now();
            } else {
                saveGame();
            }
        }
        
        function getRate() {
            let basicRate = 10 * gameData.basicQty * (1 + (gameData.basicLevel - 1) * 0.2);
            let proRate = 25 * gameData.proQty * (1 + (gameData.proLevel - 1) * 0.2);
            return basicRate + proRate;
        }
        
        function getAvailable() {
            let rate = getRate();
            let hours = (Date.now() - gameData.lastClaim) / (1000 * 60 * 60);
            let available = Math.min(rate * hours, rate * 24);
            return Math.floor(available);
        }
        
        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(gameData.balance);
            document.getElementById('available').innerText = getAvailable();
            
            let html = '';
            if (gameData.basicQty > 0) {
                let rate = 10 * gameData.basicQty * (1 + (gameData.basicLevel - 1) * 0.2);
                html += `<div class="miner">
                    <div>⚙️ Basic Miner x${gameData.basicQty} (ур.${gameData.basicLevel})<br><small>${Math.floor(rate)} монет/час</small></div>
                    <div><button class="buy-btn" onclick="upgrade('basic')">⬆️ Улучшить (500)</button></div>
                </div>`;
            }
            if (gameData.proQty > 0) {
                let rate = 25 * gameData.proQty * (1 + (gameData.proLevel - 1) * 0.2);
                html += `<div class="miner">
                    <div>⭐ Pro Miner x${gameData.proQty} (ур.${gameData.proLevel})<br><small>${Math.floor(rate)} монет/час</small></div>
                    <div><button class="buy-btn" onclick="upgrade('pro')">⬆️ Улучшить (500)</button></div>
                </div>`;
            }
            html += `<div class="miner">
                <div>🆕 Купить майнер<br><small>Basic: 1000 | Pro: 5000</small></div>
                <div>
                    <button class="buy-btn" onclick="buy('basic')">Купить Basic</button>
                    <button class="buy-btn" onclick="buy('pro')">Купить Pro</button>
                </div>
            </div>`;
            document.getElementById('minersList').innerHTML = html;
        }
        
        function claim() {
            let available = getAvailable();
            if (available <= 0) {
                alert('Нет монет! Подождите.');
                return;
            }
            gameData.balance += available;
            gameData.lastClaim = Date.now();
            saveGame();
            alert(`+${available} монет!`);
            updateUI();
        }
        
        function buy(type) {
            let price = type === 'basic' ? 1000 : 5000;
            if (gameData.balance < price) {
                alert(`Нужно ${price} монет!`);
                return;
            }
            gameData.balance -= price;
            if (type === 'basic') gameData.basicQty++;
            else gameData.proQty++;
            saveGame();
            alert(`Куплен ${type === 'basic' ? 'Basic' : 'Pro'} майнер!`);
            updateUI();
        }
        
        function upgrade(type) {
            let cost = 500;
            if (gameData.balance < cost) {
                alert(`Нужно ${cost} монет!`);
                return;
            }
            gameData.balance -= cost;
            if (type === 'basic') gameData.basicLevel++;
            else gameData.proLevel++;
            saveGame();
            alert(`Уровень повышен!`);
            updateUI();
        }
        
        loadGame();
        updateUI();
        document.getElementById('claimBtn').onclick = claim;
        Telegram.WebApp.ready();
        
        setInterval(() => {
            updateUI();
        }, 60000);
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
