<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Miner Farm</title>
    <style>
        body {
            font-family: system-ui;
            background: #0f172a;
            color: white;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            color: #fbbf24;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>💰 Баланс</div>
        <div class="balance" id="balance">1250</div>
    </div>
    <div class="card">
        <div>⚡ Доступно к сбору</div>
        <div class="balance" id="available">342</div>
        <button id="claimBtn">🚀 Забрать монеты</button>
    </div>
    <div class="card">
        <div>🛠 Мои майнеры</div>
        <div>✅ Basic Miner x3 (ур.2)<br>✅ Pro Miner x1 (ур.1)</div>
    </div>
    <script>
        let balance = 1250;
        let available = 342;
        document.getElementById('balance').innerText = balance;
        document.getElementById('available').innerText = available;
        document.getElementById('claimBtn').onclick = function() {
            balance += available;
            document.getElementById('balance').innerText = balance;
            alert('Забрано ' + available + ' монет!');
            available = 0;
            document.getElementById('available').innerText = available;
        };
    </script>
</body>
</html>
