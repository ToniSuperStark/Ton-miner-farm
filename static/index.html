<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Miner Farm</title>
    <style>
        body {
            font-family: system-ui;
            background: #0f172a;
            color: white;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .balance {
            font-size: 48px;
            font-weight: bold;
            color: #fbbf24;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>💰 Баланс</div>
        <div class="balance" id="balance">0</div>
    </div>
    <div class="card">
        <div>⚡ Доступно к сбору</div>
        <div class="balance" id="available">0</div>
        <button id="claimBtn">🚀 Забрать монеты</button>
    </div>
    <div class="card">
        <div>🛠 Мои майнеры</div>
        <div id="miners">Скоро появятся...</div>
    </div>

    <script>
        let userId = 123456789;
        
        async function loadState() {
            try {
                const res = await fetch('/state', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance || 0;
                document.getElementById('available').innerText = data.available_to_claim || 0;
            } catch(e) {
                console.log('Ошибка:', e);
            }
        }
        
        document.getElementById('claimBtn').onclick = async () => {
            try {
                const res = await fetch('/claim', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                const data = await res.json();
                if(data.success) {
                    alert('Забрано ' + data.claimed + ' монет!');
                    loadState();
                }
            } catch(e) {
                alert('Ошибка при сборе');
            }
        };
        
        loadState();
    </script>
</body>
</html>
