<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TON Miner Farm</title>
<style>body{font-family:system-ui;background:#0f172a;color:white;padding:16px}.card{background:#1e293b;border-radius:20px;padding:20px;margin-bottom:16px}.balance{font-size:48px;font-weight:bold;color:#fbbf24}button{background:#3b82f6;border:none;padding:14px;border-radius:40px;color:white;font-size:16px;width:100%}</style>
</head>
<body><div class="card"><div>💰 Баланс</div><div class="balance" id="balance">0</div></div>
<div class="card"><div>⚡ Доступно</div><div class="balance" id="available">0</div><button id="claimBtn">Забрать монеты</button></div>
<script>let userId=Telegram.WebApp.initDataUnsafe.user?.id||123;async function load(){let res=await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})});let data=await res.json();document.getElementById('balance').innerText=data.balance;document.getElementById('available').innerText=data.available_to_claim}
document.getElementById('claimBtn').onclick=async()=>{let res=await fetch('/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})});let data=await res.json();alert('Забрано '+data.claimed);load()};load();Telegram.WebApp.ready();</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script></body></html>
